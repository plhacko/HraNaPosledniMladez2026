<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mládež 2026 — Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #1a1a2e;
      border-bottom: 1px solid #333;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    #status-badge {
      margin-left: auto;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: #2a2a3e;
      color: #aaa;
    }

    #status-badge.ok { background: #14532d; color: #86efac; }
    #status-badge.err { background: #7f1d1d; color: #fca5a5; }

    #refresh-btn {
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a3e;
      color: #ccc;
      cursor: pointer;
    }

    #refresh-btn:hover { background: #3a3a5e; }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #map {
      flex: 1;
      min-width: 0;
    }

    #sidebar {
      width: 320px;
      flex-shrink: 0;
      background: #12121f;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 10px 14px;
      border-bottom: 1px solid #333;
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    #event-count {
      background: #2a2a3e;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      color: #aaa;
    }

    #event-log {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .event-card {
      background: #1e1e30;
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid #555;
      cursor: pointer;
      transition: background 0.15s;
    }

    .event-card:hover { background: #2a2a42; }

    .event-card .ev-team {
      font-weight: 700;
      font-size: 0.9rem;
      color: #fff;
    }

    .event-card .ev-location {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 2px;
    }

    .event-card .ev-meta {
      font-size: 0.7rem;
      color: #666;
      margin-top: 4px;
      display: flex;
      gap: 8px;
    }

    .ev-badge {
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .ev-badge.geo { background: #1d4ed8; color: #bfdbfe; }
    .ev-badge.opened { background: #6b21a8; color: #e9d5ff; }
    .ev-badge.check { background: #374151; color: #d1d5db; }

    #empty-msg {
      color: #555;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 40px;
      padding: 0 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<header>
  <h1>Mládež 2026 — Monitor</h1>
  <button id="refresh-btn" onclick="fetchEvents()">↻ Obnovit</button>
  <span id="status-badge">Načítám…</span>
</header>

<main>
  <div id="map"></div>
  <div id="sidebar">
    <div id="sidebar-header">
      Události
      <span id="event-count">0</span>
    </div>
    <div id="event-log">
      <p id="empty-msg">Žádné události zatím.<br>Spusťte hru na telefonech a události se zobrazí zde.</p>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const TOPIC = 'mz26g8r3n1x5k7p4';

  // Persistent team → color mapping
  const TEAM_COLORS = [
    '#ef4444', '#3b82f6', '#22c55e', '#f59e0b',
    '#a855f7', '#ec4899', '#14b8a6', '#f97316',
  ];
  const teamColorMap = {};
  let colorIdx = 0;

  function teamColor(name) {
    if (!teamColorMap[name]) {
      teamColorMap[name] = TEAM_COLORS[colorIdx % TEAM_COLORS.length];
      colorIdx++;
    }
    return teamColorMap[name];
  }

  // Leaflet map centered on Prague game area
  const map = L.map('map').setView([50.055, 14.42], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19,
  }).addTo(map);

  // Fixed markers for all 10 locations
  const LOCATIONS = [
    { id: 1,  name: 'Chvilka filosofie',   lat: 50.0432, lng: 14.4120 },
    { id: 2,  name: 'Být či nebýt',         lat: 50.0706, lng: 14.4248 },
    { id: 3,  name: 'Císařský ostrov',      lat: 50.0522, lng: 14.4117 },
    { id: 4,  name: 'Rubicon',              lat: 50.0667, lng: 14.4285 },
    { id: 5,  name: 'Ve zdravém těle',      lat: 50.0637, lng: 14.4173 },
    { id: 6,  name: 'Mauglí',               lat: 50.0549, lng: 14.4189 },
    { id: 7,  name: 'U řek babylonských',   lat: 50.0503, lng: 14.4125 },
    { id: 8,  name: 'Mind Meld',            lat: 50.0498, lng: 14.4176 },
    { id: 9,  name: 'Piš barde skládej',    lat: 50.0521, lng: 14.4269 },
    { id: 10, name: 'Polyfémos',            lat: 50.0670, lng: 14.4147 },
    { id: 11, name: 'Neplecha ukončena',    lat: 50.0236, lng: 14.4114 },
  ];

  LOCATIONS.forEach(loc => {
    L.circleMarker([loc.lat, loc.lng], {
      radius: 8, color: '#fff', weight: 1.5,
      fillColor: '#334155', fillOpacity: 0.9,
    }).addTo(map).bindTooltip(loc.name, { permanent: false });
  });

  // Event markers layer
  const eventLayer = L.layerGroup().addTo(map);

  let allEvents = [];

  function makeIcon(color) {
    return L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,0.6)"></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7],
    });
  }

  function renderEvents(events) {
    eventLayer.clearLayers();
    const log = document.getElementById('event-log');
    const empty = document.getElementById('empty-msg');

    if (events.length === 0) {
      empty.style.display = 'block';
      document.getElementById('event-count').textContent = '0';
      return;
    }

    empty.style.display = 'none';
    document.getElementById('event-count').textContent = events.length;

    // Draw a polyline per team (chronological order) before markers
    const byTeam = {};
    events.forEach(ev => {
      if (!byTeam[ev.team]) byTeam[ev.team] = [];
      byTeam[ev.team].push(ev);
    });
    Object.entries(byTeam).forEach(([team, tevents]) => {
      const color = teamColor(team);
      const coords = tevents
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
        .map(ev => {
          const lat = ev.userLat ?? ev.targetLat;
          const lng = ev.userLng ?? ev.targetLng;
          return (lat && lng) ? [lat, lng] : null;
        })
        .filter(Boolean);
      if (coords.length >= 2) {
        L.polyline(coords, { color, weight: 2.5, opacity: 0.65, dashArray: '7 5' }).addTo(eventLayer);
      }
    });

    // Newest first in sidebar
    const sorted = [...events].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    // Clear log (keep empty-msg node)
    Array.from(log.children).forEach(el => { if (el.id !== 'empty-msg') el.remove(); });

    sorted.forEach(ev => {
      const color = teamColor(ev.team);
      const lat = ev.userLat ?? ev.targetLat;
      const lng = ev.userLng ?? ev.targetLng;

      // Map marker
      if (lat && lng) {
        const marker = L.marker([lat, lng], { icon: makeIcon(color) }).addTo(eventLayer);
        const time = new Date(ev.timestamp).toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
        const distTxt = ev.distanceM != null ? ` · ${ev.distanceM} m` : '';
        marker.bindPopup(
          `<strong style="color:${color}">${ev.team}</strong><br>` +
          `${ev.locationName}<br>` +
          `<span style="color:#888;font-size:0.8em">${time}${distTxt}</span>`
        );
      }

      // Sidebar card
      const card = document.createElement('div');
      card.className = 'event-card';
      card.style.borderLeftColor = color;
      const time = new Date(ev.timestamp).toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const badgeClass = ev.event === 'geo_verified' ? 'geo' : ev.event === 'card_opened' ? 'opened' : 'check';
      const badgeLabel = ev.event === 'geo_verified' ? 'GPS ✓' : ev.event === 'card_opened' ? 'Otevřeno' : 'Poloha';
      const distTxt = ev.distanceM != null ? `${ev.distanceM} m` : '';
      card.innerHTML = `
        <div class="ev-team">${ev.team}</div>
        <div class="ev-location">${ev.locationName ?? '—'}</div>
        <div class="ev-meta">
          <span class="ev-badge ${badgeClass}">${badgeLabel}</span>
          <span>${time}</span>
          ${distTxt ? `<span>${distTxt}</span>` : ''}
        </div>`;
      if (lat && lng) {
        card.addEventListener('click', () => {
          map.setView([lat, lng], 16);
        });
      }
      log.appendChild(card);
    });
  }

  async function fetchEvents() {
    const badge = document.getElementById('status-badge');
    try {
      const res = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1&since=12h`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const parsed = text.trim().split('\n')
        .filter(Boolean)
        .map(line => {
          try { return JSON.parse(line); } catch { return null; }
        })
        .filter(Boolean)
        .map(msg => {
          try { return JSON.parse(msg.message); } catch { return null; }
        })
        .filter(ev => ev && ev.event && ev.team);

      allEvents = parsed;
      renderEvents(allEvents);

      const now = new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      badge.textContent = `Aktualizováno ${now}`;
      badge.className = 'ok';
    } catch (err) {
      badge.textContent = `Chyba: ${err.message}`;
      badge.className = 'err';
    }
  }

  // Initial load + auto-refresh every 30 s
  fetchEvents();
  setInterval(fetchEvents, 30_000);
</script>
</body>
</html>
